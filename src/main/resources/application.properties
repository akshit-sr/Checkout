spring.application.name=checkout-platform

# --- PostgreSQL (override via env vars in real deployments) ---
# One database holds both the storefront and the inventory tables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkout_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Seeded admin account (override via env vars in real deployments) ---
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:123456789}

# --- JWT ---
# Provide APP_JWT_SECRET (a long, random base64 string) via env var in real
# deployments. The fallback below is for local dev only — never use it in prod.
app.jwt.secret=${APP_JWT_SECRET:YIjWMUh/8Kof5ZLnKTWY0pQHWFG4IcMaYfAoILZ7iwcpqYDjdIx8umjlCiWF+fDn3E7s6MxgvnyH8vdYlI0EkA==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Inventory back office ---
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}
app.inventory.alert-recipient=${ALERT_RECIPIENT:manager@example.com}

# --- Mail (low-stock alert emails) ---
# For Gmail: use an App Password, not your real password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
