[project]
name = "checkout-api"
version = "1.0.0"
description = "Checkout and inventory FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "bcrypt>=4,<6",
    "PyJWT>=2.9,<3",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["httpx2>=2.13,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
